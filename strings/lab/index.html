const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(code) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(code), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(P.salt), iterations: P.iter }, base, 512));
  const aesKey = await crypto.subtle.importKey('raw', bits.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
  const macKey = await crypto.subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
  const iv = b64(P.iv), ct = b64(P.ct);
  const msg = new Uint8Array(iv.length + ct.length); msg.set(iv); msg.set(ct, iv.length);
  if (!await crypto.subtle.verify('HMAC', macKey, b64(P.tag), msg)) throw new Error('bad code');
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, aesKey, ct));
}
function show(html) {
  const f = document.createElement('iframe');
  f.title = 'String Gauge Bench';
  f.srcdoc = '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' + html + '</html>';
  document.getElementById('gate').replaceWith(f);
}
async function tryCode(code, quiet) {
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; err.textContent = '';
  try {
    const html = await unlock(code.trim());
    try { sessionStorage.setItem('sgb.code', code.trim()); } catch (e) {}
    show(html);
  } catch (e) {
    if (!quiet) err.textContent = '코드가 맞지 않습니다.';
    btn.disabled = false;
  }
}
document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); tryCode(document.getElementById('code').value, false); });
(function () {
  if (!window.crypto || !crypto.subtle) { document.getElementById('err').textContent = '이 브라우저는 WebCrypto 를 지원하지 않습니다.'; return; }
  const m = location.hash.match(/[#&]k=([^&]+)/);
  if (m) { history.replaceState(null, '', location.pathname); tryCode(decodeURIComponent(m[1]), false); return; }
  let saved = ''; try { saved = sessionStorage.getItem('sgb.code') || ''; } catch (e) {}
  if (saved) tryCode(saved, true);
})();
