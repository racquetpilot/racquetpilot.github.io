<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance Point Calculator · RacquetPilot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700;800&display=swap">
<style>
/* 생성물 — 고치지 말 것. tool/module_base.py 가 정본 토큰에서 만든다.
   정본: docs/design/2026-10-07-theme-pair/theme-tokens.json (v1, user-selected)
   light = 미네랄 블루 · dark = 나이트 · 아이스 */
:root{--paper:#EEF2F5;--card:#FFFFFF;--soft:#DFE9EF;--ink:#253744;--ink2:#566775;--line:#CDD7DD;--action:#305B76;--on-action:#FFFFFF;--link:#305B76;--selected:#D0E2ED;--selected-ink:#243F51;--focus:#305B76;--data:#3C647E;--feature:#E5EEF3;--header:#253F51;--header-ink:#FFFFFF;--accent2:#416B82;--r:18px;--mw:980px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#171F27;--card:#232E38;--soft:#303E49;--ink:#F1F5F7;--ink2:#B3C1CA;--line:#45545F;--action:#B6D9E7;--on-action:#1C3542;--link:#B6D9E7;--selected:#B6D9E7;--selected-ink:#1C3542;--focus:#B6D9E7;--data:#CADFE8;--feature:#293944;--header:#171F27;--header-ink:#F1F5F7;--accent2:#B6D9E7}}
:root[data-theme="dark"]{--paper:#171F27;--card:#232E38;--soft:#303E49;--ink:#F1F5F7;--ink2:#B3C1CA;--line:#45545F;--action:#B6D9E7;--on-action:#1C3542;--link:#B6D9E7;--selected:#B6D9E7;--selected-ink:#1C3542;--focus:#B6D9E7;--data:#CADFE8;--feature:#293944;--header:#171F27;--header-ink:#F1F5F7;--accent2:#B6D9E7}

/* ── 뼈대 ────────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
html{color-scheme:light}
html[data-theme="dark"],:root[data-theme="dark"]{color-scheme:dark}
body{margin:0;background:var(--paper);color:var(--ink);font-size:17px;line-height:1.6;
  font-family:"IBM Plex Sans KR",-apple-system,"Pretendard",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
.m-wrap{max-width:var(--mw);margin:0 auto;padding:26px 20px 90px}

/* ── 머리 ────────────────────────────────────────────────────────────── */
.m-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  padding-bottom:18px;border-bottom:1px solid var(--line)}
.m-brand{font-weight:800;font-size:18px;letter-spacing:-.01em}
.m-brand span{display:block;color:var(--ink2);font-weight:500;font-size:14px;margin-top:2px}
.m-tools{display:flex;gap:10px;align-items:center}
.m-seg{display:flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;
  background:var(--card)}
.m-seg button{font:inherit;font-size:13.5px;font-weight:700;border:0;padding:9px 15px;
  background:transparent;color:var(--ink2);cursor:pointer;line-height:1.2}
.m-seg button.on{background:var(--selected);color:var(--selected-ink)}

/* ── 제목 ────────────────────────────────────────────────────────────── */
.m-title{font-size:34px;line-height:1.18;letter-spacing:-.022em;margin:30px 0 8px;
  word-break:keep-all;text-wrap:balance}
.m-lede{color:var(--ink2);margin:0 0 26px;font-size:16.5px;max-width:62ch;word-break:keep-all}

/* ── 카드 ────────────────────────────────────────────────────────────── */
.m-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px;margin-bottom:16px}
.m-cap{display:block;font-size:12.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--link);margin:0 0 16px}

/* ── 입력 ────────────────────────────────────────────────────────────── */
.m-field{display:block}
.m-label{display:block;font-size:13.5px;font-weight:700;color:var(--ink2);margin:0 0 7px}
.m-select,.m-input{font:inherit;font-size:17px;width:100%;padding:15px 14px;
  border:1.5px solid var(--line);border-radius:13px;background:var(--paper);color:var(--ink)}
.m-select{font-weight:600;cursor:pointer}
.m-input{font-variant-numeric:tabular-nums}
.m-hint{font-size:13.5px;color:var(--ink2);margin:8px 0 0;line-height:1.55;word-break:keep-all}
.m-grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.m-btn{font:inherit;font-weight:800;font-size:17px;width:100%;padding:17px;border:0;
  border-radius:14px;background:var(--action);color:var(--on-action);cursor:pointer;
  margin-top:6px}
.m-btn:disabled{opacity:.45;cursor:default}
.m-toggle{font:inherit;font-size:14px;font-weight:700;color:var(--link);background:none;
  border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* ── 결과 ────────────────────────────────────────────────────────────── */
.m-out{text-align:center;padding:34px 20px 26px}
.m-big{font-size:86px;font-weight:800;letter-spacing:-.035em;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.m-big em{font-style:normal;font-size:38px;margin-left:10px;color:var(--link);
  letter-spacing:-.01em}
.m-big.small{font-size:40px;letter-spacing:-.02em}
.m-sub{color:var(--ink2);font-size:15px;margin-top:12px;font-variant-numeric:tabular-nums}
.m-note{background:var(--feature);color:var(--ink);border-radius:13px;padding:13px 15px;
  font-size:14px;line-height:1.55;margin-top:18px;text-align:left;word-break:keep-all}

/* ── 꼬리 ────────────────────────────────────────────────────────────── */
.m-foot{color:var(--ink2);font-size:14px;line-height:1.7;margin-top:34px;padding-top:20px;
  border-top:1px solid var(--line);word-break:keep-all}
.m-foot b{color:var(--ink)}
.m-foot code{background:var(--soft);padding:2px 7px;border-radius:6px;font-size:13.5px}
.m-foot p{margin:0 0 10px}
[hidden]{display:none !important}

@media(max-width:620px){
  body{font-size:16px}
  .m-wrap{padding:20px 16px 72px}
  .m-title{font-size:27px}
  .m-grid2{grid-template-columns:1fr}
  .m-big{font-size:66px}
  .m-big em{font-size:30px}
  .m-card{padding:18px}
}


/* ── 한 화면 ──────────────────────────────────────────────────────────────
   왼쪽 두 칸(라켓 + 측정값)과 오른쪽 한 칸이 **같은 높이**로 한 화면에 들어와야 한다.
   그래서 높이는 왼쪽이 정하고(grid align-items:stretch), 오른쪽은 그 높이를 채운다.
   남는 자리는 시소 그림이 먹는다 — 그림이 칸을 늘리지 않고, 칸이 그림 크기를 정한다. */
:root{--mw:1160px}
.bc-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.04fr);gap:18px;
  align-items:stretch}
.bc-left{display:flex;flex-direction:column;gap:18px}
.bc-left>.m-card{margin:0}
.bc-right{display:flex}
.bc-right>.m-card{margin:0;flex:1;display:flex;flex-direction:column}
.bc-right .m-cap{text-align:left}
.bc-meas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.92fr);gap:14px}
@media(max-width:620px){.bc-meas{grid-template-columns:1fr}}

@media(min-width:901px){
  .m-wrap{padding:20px 20px 44px}
  /* 왼쪽 단은 좁다 — 모델 이름이 길어 브랜드 쪽을 줄여 준다. */
  .bc-left .m-grid2{grid-template-columns:minmax(0,.62fr) minmax(0,1fr);gap:14px}
  .m-title{font-size:30px;margin:16px 0 6px}
  .m-lede{font-size:15.5px;margin:0 0 18px;max-width:none}
  .m-card{padding:20px}
  .m-cap{margin-bottom:12px}
  .m-select,.m-input{padding:13px 13px}
  .m-btn{padding:15px;margin-top:4px}
  .m-foot{margin-top:24px;padding-top:16px}
}
/* 낮은 화면(노트북 720~800px)에서도 한 화면에 들어오게 — 글자 크기는 두고 사이를 줄인다. */
@media(min-width:901px) and (max-height:830px){
  .m-wrap{padding-top:12px}
  .m-head{padding-bottom:12px}
  .m-title{font-size:25px;margin:10px 0 4px}
  .m-lede{font-size:14.5px;margin-bottom:12px}
  .m-card{padding:16px}
  .m-cap{margin-bottom:8px}
  .m-label{margin-bottom:5px}
  .m-select,.m-input{padding:11px 12px}
  .m-hint{font-size:13px;margin-top:6px;line-height:1.5}
  .m-btn{padding:13px}
  .bc-cols{gap:14px}
  .bc-left{gap:14px}
  .bc-sel{margin-top:10px;padding-top:10px}
  .bc-left p{margin-top:10px !important}
}
@media(max-width:900px){.bc-cols{grid-template-columns:1fr}.bc-left{gap:16px}}

/* ── 고른 라켓 ───────────────────────────────────────────────────────────
   사진은 오른쪽 시소에 크게 나온다 — 여기서는 이름과 스펙만. */
.bc-sel{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.bc-who>b{display:block;font-size:18px;line-height:1.3;letter-spacing:-.01em}
.bc-who .sub{color:var(--ink2);font-size:14px}
.bc-spec{margin-top:6px;font-size:14.5px;color:var(--ink2)}
.bc-spec b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ── 시소 ─────────────────────────────────────────────────────────────── */
.bc-see{position:relative;flex:1 1 auto;min-height:160px;margin:2px 0 0}
.bc-see.dim{opacity:.4}
.bc-rq{position:absolute;transform-origin:50% 50%;
  transition:transform .75s cubic-bezier(.22,1.2,.36,1)}
.bc-rq svg{width:100%;display:block;color:var(--ink);opacity:.88}
.bc-rq .bp{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;
  background:var(--data);border:3px solid var(--card);transform:translate(-50%,-50%);
  box-shadow:0 0 0 1.5px var(--line);z-index:2;
  transition:left .75s cubic-bezier(.22,1.2,.36,1)}
.bc-mark{position:absolute;top:14%;bottom:14%;width:2px;margin-left:-1px;background:var(--data);
  opacity:.45;transition:left .75s cubic-bezier(.22,1.2,.36,1)}
.bc-fulc{position:absolute;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:14px solid transparent;border-right:14px solid transparent;
  border-bottom:24px solid var(--ink2);opacity:.5}
.bc-ground{position:absolute;left:10%;right:10%;height:3px;border-radius:2px;
  background:var(--ink2);opacity:.35}
.bc-side{position:absolute;bottom:0;font-size:12px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink2)}
.bc-side.l{left:1%}.bc-side.r{right:1%}
.bc-seelbl{text-align:center;font-size:13px;color:var(--ink2);margin:4px 0 0;min-height:20px}

/* ── 결과 숫자 ───────────────────────────────────────────────────────────
   한 화면 안에서 숫자와 그림이 자리를 나눠 쓴다 — 화면이 높으면 숫자도 커진다. */
.bc-big{font-size:clamp(82px, 13vh, 124px);font-weight:800;letter-spacing:-.04em;
  line-height:.92;font-variant-numeric:tabular-nums;color:var(--ink)}
.bc-big em{font-style:normal;font-size:.39em;margin-left:.1em;color:var(--link);
  letter-spacing:-.01em}
.bc-big.small{font-size:34px;letter-spacing:-.02em;line-height:1.25;color:var(--ink2)}
.bc-full{font-size:16px;font-weight:700;color:var(--link);margin-top:6px;letter-spacing:.01em}
.bc-wait{font-size:15.5px;max-width:36ch;margin:6px auto 0;padding-top:4px;
  word-break:keep-all}
@media(max-width:620px){.bc-big{font-size:76px}.bc-see{min-height:190px}}

.bc-cmp{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:15px;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;text-align:left}
.bc-cmp b{font-variant-numeric:tabular-nums;color:var(--ink)}
.bc-right .m-note{margin-top:14px}
</style>
</head>
<body>
<div class="m-wrap">

<header class="m-head">
  <div class="m-brand">RacquetPilot<span data-t="sub">밸런스 포인트 계산기</span></div>
  <div class="m-tools">
    <div class="m-seg" id="theme">
      <button data-theme="light" data-t="light">밝게</button>
      <button data-theme="dark" data-t="dark">어둡게</button>

      <button data-lang="ko" class="on">한국어</button><button data-lang="en">English</button>
    </div>

</header>

<h1 class="m-title" data-t="h1">밸런스 보드 값을 포인트로</h1>
<p class="m-lede" data-t="lede">밸런스 보드에서 읽은 값(cm)을 넣으면 헤드라이트·헤드헤비 몇 포인트인지 0.5 단위로 알려줘요.</p>

<div class="bc-cols">
<div class="bc-left">

<div class="m-card">
  <span class="m-cap" data-t="l_pick">라켓</span>
  <div class="m-grid2">
    <label class="m-field"><span class="m-label" data-t="l_brand">브랜드</span>
      <select class="m-select" id="brand"></select></label>
    <label class="m-field"><span class="m-label" data-t="l_model">모델</span>
      <select class="m-select" id="model"></select></label>
  </div>

  <div class="bc-sel" id="selBox">
    <div class="bc-who">
      <b id="rName">·</b>
      <span class="sub" id="rSub"></span>
      <div class="bc-spec" id="rSpec"></div>
    </div>
  </div>

  <div id="manualBox" hidden>
    <label class="m-field"><span class="m-label" data-t="l_len">전장 (cm)</span>
      <input class="m-input" id="manLen" type="number" step="0.01" min="40" max="90"
             inputmode="decimal" placeholder="68.58"></label>
    <p class="m-hint" data-t="h_len"></p>
  </div>

  <p style="margin:14px 0 0">
    <button class="m-toggle" id="manBtn" data-t="noList">목록에 없어요 · 전장 직접 넣기</button>
  </p>
</div>

<div class="m-card">
  <span class="m-cap" data-t="l_meas">측정값</span>
  <div class="bc-meas">
    <label class="m-field"><span class="m-label" data-t="l_bp">밸런스 포인트 (cm)</span>
      <input class="m-input" id="bp" type="number" step="0.01" min="0" inputmode="decimal" placeholder="32.5">
      <p class="m-hint" data-t="h_bp"></p></label>
    <label class="m-field"><span class="m-label" data-t="l_ref">비교값 (cm, 선택)</span>
      <input class="m-input" id="ref" type="number" step="0.01" min="0" inputmode="decimal" placeholder="33.0">
      <p class="m-hint" data-t="h_ref"></p></label>
  </div>
  <button class="m-btn" id="go" data-t="calc">계산</button>
</div>

</div>
<div class="bc-right">

<div class="m-card m-out" id="out">
  <span class="m-cap" data-t="l_out">결과</span>
  <div class="bc-big" id="big" hidden></div>
  <div class="bc-full" id="full" hidden></div>
  <div class="m-sub" id="exact"></div>

  <div class="bc-see" id="see">
    <div class="bc-ground" id="ground"></div>
    <div class="bc-fulc" id="fulc"></div>
    <div class="bc-rq" id="rq"><span id="rqArt"></span>
      <span class="bc-mark" id="mark"></span><span class="bp" id="dot"></span></div>
    <div class="bc-side l" data-t="sideButt">손잡이</div>
    <div class="bc-side r" data-t="sideHead">헤드</div>
  </div>
  <p class="bc-seelbl" id="seeLbl"></p>

  <div class="m-note" id="warn" hidden></div>
  <div class="bc-cmp" id="cmp" hidden></div>
</div>

</div>
</div>

<div class="m-foot">
  <p data-t="f1"></p>
  <p data-t="f2"></p>
</div>
</div>

const brands = () => [...new Set(R.map(r => r.brand))];   // 빌더가 정한 차례 그대로
const modelsOf = b => R.filter(r => r.brand === b);
const label = r => r.model + (r.gen ? ' ' + r.gen : '') + (r.year ? ' (' + r.year + ')' : '');

function fillBrands() {
  $('brand').innerHTML = brands().map(b => `<option>${b}</option>`).join('');
  fillModels();
}
function fillModels() {
  const list = modelsOf($('brand').value);
  $('model').innerHTML = list.map((r, i) => `<option value="${i}">${label(r)}</option>`).join('');
  pick(list[0]);
}
function pick(r) {
  cur = r;
  const t = T[lang];
  $('rName').textContent = r.brand + ' ' + r.model;
  $('rSub').textContent = [r.gen, r.year].filter(Boolean).join(' · ');
  const L = r.lengthIn * 2.54;
  $('rSpec').innerHTML = `${t.len} <b>${r.lengthIn}"</b> = <b>${L.toFixed(2)} cm</b>`
    + (r.headSqIn ? ` · ${t.head} <b>${r.headSqIn}</b> sq in` : '');
  showWaiting();
}

/* 목록에 없는 라켓 — 전장만 받아서 같은 식으로 계산한다. */
function setManual(on) {
  manual = on;
  $('manualBox').hidden = !on;
  $('selBox').hidden = on;
  $('brand').closest('.m-grid2').hidden = on;
  $('manBtn').textContent = T[lang][on ? 'inList' : 'noList'];
  showWaiting();
}
function lengthCm() {
  if (manual) {
    const v = parseFloat($('manLen').value);
    return isFinite(v) && v > 0 ? v : null;
  }
  return cur ? cur.lengthIn * 2.54 : null;
}

/* ── 시소 자리잡기 ───────────────────────────────────────────────────────
   칸에 남은 높이 안에서 라켓을 기울인다. 기운 뒤의 바깥 네모가 그 높이를 넘지 않도록
   폭을 줄이는 쪽이다 — 그림이 칸을 밀어내면 한 화면이 깨진다.
   받침은 라켓의 **긴 축** 바로 밑, 바닥선은 기울어 내려간 끝보다 아래. */
const LBL = 20, GAP = 30;
let lastDeg = 0, artRatio = .4;

/* 라켓 도식 — 그 라켓의 **전장과 헤드 면적으로 그린다**. 비율의 바탕은 우리가 만든 원본 그림이고
   (길이를 1 로 둔 값), 스트링베드 타원의 넓이가 곧 헤드 면적이 되도록 가로·세로를 푼다.
   그래서 헤드가 큰 라켓은 그림에서도 머리가 크고 목이 짧다. 사진은 쓰지 않는다. */
const RQ = {aspect:1.346, rim:.0213, grip:.339, hand:.0547, butt:.0593, yoke:.0747};

function racquetArt(L, headSqIn) {
  const A = (headSqIn || 100) * 6.4516;                  // sq in → cm²
  const bw = Math.sqrt(4 * A / (Math.PI * RQ.aspect));   // 스트링베드 폭
  const bh = RQ.aspect * bw;                             // 스트링베드 길이
  const rim = RQ.rim * L, gl = RQ.grip * L, hw = RQ.hand * L, bt = RQ.butt * L;
  const ow = bw + 2 * rim;                               // 후프 바깥 폭
  const cx = L - (bh / 2 + rim);                         // 후프 중심 (x: 버트캡 0 → 팁 L)
  const rx = bh / 2 + rim / 2, ry = bw / 2 + rim / 2;    // 테의 중심선 타원
  const yJ = Math.min(RQ.yoke * L, ry * .9);             // 요크가 후프에 닿는 높이
  const xJ = cx - rx * Math.sqrt(Math.max(0, 1 - (yJ / ry) ** 2));
  const x0 = gl, y0 = hw * .30;                          // 목이 손잡이에서 갈라지는 자리
  const qx = x0 + (xJ - x0) * .55;
  const arm = d => `M${x0} ${d * y0}Q${qx} ${d * yJ * .62} ${xJ} ${d * yJ}`;
  artRatio = ow / L;
  return `<svg viewBox="0 ${-ow / 2} ${L} ${ow}" fill="none" stroke="currentColor"`
    + ` stroke-width="${rim}" stroke-linecap="round" aria-hidden="true">`
    + `<rect x="0" y="${-bt / 2}" width="${bt * .62}" height="${bt}" rx="${bt * .3}"`
    + ` fill="currentColor" stroke="none"/>`
    + `<rect x="${bt * .2}" y="${-hw / 2}" width="${gl - bt * .2}" height="${hw}"`
    + ` rx="${hw * .34}" fill="currentColor" stroke="none"/>`
    + `<path d="${arm(-1)}"/><path d="${arm(1)}"/>`
    + `<ellipse cx="${cx}" cy="0" rx="${rx}" ry="${ry}"/>`
    + `</svg>`;
}

function layoutSee(deg) {
  const box = $('see'), W = box.clientWidth, H = box.clientHeight;
  if (!W || !H) return;
  const ratio = artRatio;
  const rad = Math.abs(deg || 0) * Math.PI / 180, s = Math.sin(rad), c = Math.cos(rad);
  const room = Math.max(90, H - LBL - GAP);
  const w = Math.max(120, Math.min(W * .96, room / (ratio * c + s)));
  const h = w * ratio;
  const rq = $('rq');
  rq.style.width = w + 'px';
  rq.style.height = h + 'px';
  rq.style.left = ((W - w) / 2) + 'px';
  const half = (w * s + h * c) / 2;
  const axis = Math.max(half, room / 2);
  rq.style.top = (axis - h / 2) + 'px';
  const ground = axis + Math.max(26, half + 8);
  const f = $('fulc'), fh = ground - axis;
  f.style.top = axis + 'px';
  f.style.borderBottomWidth = fh + 'px';
  f.style.borderLeftWidth = f.style.borderRightWidth =
    Math.min(18, Math.max(9, Math.round(fh * .22))) + 'px';
  $('ground').style.top = ground + 'px';
}

function setRacquet(deg) {
  lastDeg = deg;
  const L = lengthCm() || (cur ? cur.lengthIn * 2.54 : 68.58);
  $('rqArt').innerHTML = racquetArt(L, manual ? 100 : (cur && cur.headSqIn));
  $('rq').style.transform = `rotate(${deg.toFixed(2)}deg)`;
  layoutSee(deg);
  requestAnimationFrame(() => layoutSee(deg));   // 글꼴·사진이 들어온 뒤 한 번 더
}
/* 칸 높이는 글꼴이 늦게 오거나 경고·비교줄이 붙으면 나중에 바뀐다. 그때마다 다시 잡는다.
   라켓은 absolute 라 크기를 줄여도 칸이 다시 바뀌지 않는다 — 되돌이가 생기지 않는다. */
if (window.ResizeObserver) {
  let t = 0;
  new ResizeObserver(() => {
    cancelAnimationFrame(t);
    t = requestAnimationFrame(() => layoutSee(lastDeg));
  }).observe($('see'));
}
addEventListener('resize', () => layoutSee(lastDeg));
addEventListener('load', () => layoutSee(lastDeg));

/* 계산 전 — 칸은 그대로 있고, 라켓은 수평으로 누워 기다린다. */
function showWaiting(msg) {
  $('big').hidden = true;
  $('full').hidden = true;
  $('exact').className = 'm-sub bc-wait';
  $('exact').textContent = msg || T[lang].waiting;
  $('warn').hidden = true;
  $('cmp').hidden = true;
  $('see').classList.remove('dim');
  $('dot').hidden = $('mark').hidden = true;
  $('seeLbl').textContent = T[lang].seeReady;
  setRacquet(0);
}

/* 못 하는 경우 — 숫자 자리에 이유를 쓰고, 그림은 수평으로 돌려 흐리게 둔다.
   기울어 있으면 거짓을 읽히게 된다. */
function showNope(why, warn) {
  const t = T[lang];
  $('big').hidden = false;
  $('big').className = 'bc-big small';
  $('big').textContent = t.nope;
  $('full').hidden = true;
  $('exact').className = 'm-sub bc-wait';
  $('exact').textContent = why;
  $('cmp').hidden = true;
  $('warn').hidden = !warn;
  $('warn').textContent = warn || '';
  $('see').classList.add('dim');
  $('dot').hidden = $('mark').hidden = true;
  $('seeLbl').textContent = t.seeReady;
  setRacquet(0);
}

const half = x => Math.round(x * 2) / 2;

function calc() {
  const t = T[lang], L = lengthCm();
  if (L === null) { showNope(t.needLen, ''); return; }
  const mid = L / 2, bp = parseFloat($('bp').value);
  if (!isFinite(bp) || bp <= 0) { showWaiting(); return; }

  const p = (mid - bp) / CM_PT, r = half(p);
  const tooFar = Math.abs(p) > 20;
  if (bp > L || tooFar) { showNope(t.nopeWhy, bp > L ? t.over : t.far); return; }

  const dir = r > 0 ? t.hl : (r < 0 ? t.hh : '');
  $('big').hidden = false;
  $('big').className = 'bc-big';
  $('big').innerHTML = r === 0 ? t.even : `${Math.abs(r).toFixed(1)}<em>${dir}</em>`;
  $('full').hidden = false;
  $('full').textContent = r === 0 ? t.evenFull : (r > 0 ? t.hlFull : t.hhFull);
  $('exact').className = 'm-sub';
  $('exact').textContent = t.exact(Math.abs(p), mid);

  const w = (bp < 30 || bp > 35) ? t.range : '';
  $('warn').hidden = !w;
  $('warn').textContent = w;

  const rf = parseFloat($('ref').value);
  if (isFinite(rf) && rf > 0) {
    const rp = half((mid - rf) / CM_PT), d = r - rp;
    const fmt = v => v === 0 ? t.even : `${Math.abs(v).toFixed(1)} ${v > 0 ? t.hl : t.hh}`;
    $('cmp').innerHTML = `<span>${t.cmpL} <b>${rf.toFixed(2)} cm</b> = <b>${fmt(rp)}</b></span>`
      + `<span>${t.diff} <b>${d === 0 ? '0.0' : (d > 0 ? '+' : '') + d.toFixed(1)}</b></span>`;
    $('cmp').hidden = false;
  } else $('cmp').hidden = true;

  /* 시소 — 중점을 받침으로 두고 기운다. 헤드라이트면 헤드(오른쪽)가 들린다.
     각도는 눈에 읽히는 정도로만 눌러 둔다(최대 16도): 그림은 비유이지 측정이 아니다.
     경고·비교줄을 붙인 **뒤에** 잡는다 — 그만큼 시소 칸이 줄어든 높이로 재야 한다. */
  $('see').classList.remove('dim');
  $('dot').hidden = $('mark').hidden = false;
  const at = (Math.max(0, Math.min(1, bp / L)) * 100) + '%';
  $('dot').style.left = at; $('mark').style.left = at;
  $('seeLbl').textContent = r === 0 ? t.seeEven : (r > 0 ? t.seeHL : t.seeHH);
  setRacquet(Math.max(-16, Math.min(16, -r * 1.15)));
}

/* 밝게/어둡게 — 고르면 기억하고, 고르기 전에는 기기 설정을 따른다. */
function setTheme(v, save) {
  document.documentElement.setAttribute('data-theme', v);
  [...document.querySelectorAll('#theme button')]
    .forEach(b => b.classList.toggle('on', b.dataset.theme === v));
  if (save) { try { localStorage.setItem('bpc.theme', v); } catch (e) {} }
}
function initTheme() {
  let v = null;
  try { v = localStorage.getItem('bpc.theme'); } catch (e) {}
  if (!v) v = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  setTheme(v, false);
}

function setLang(v) {
  lang = v;
  document.documentElement.lang = v;
  [...document.querySelectorAll('#lang button')].forEach(b => b.classList.toggle('on', b.dataset.lang === v));
  const t = T[v];
  document.querySelectorAll('[data-t]').forEach(el => {
    const s = t[el.dataset.t]; if (typeof s === 'string') el.innerHTML = s;
  });
  $('manBtn').textContent = t[manual ? 'inList' : 'noList'];
  if (cur) pick(cur);
  calc();
}

$('brand').onchange = fillModels;
$('model').onchange = () => pick(modelsOf($('brand').value)[+$('model').value]);
$('go').onclick = calc;
$('manBtn').onclick = () => setManual(!manual);
['bp', 'ref', 'manLen'].forEach(id =>
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') calc(); }));
[...document.querySelectorAll('#lang button')].forEach(b => b.onclick = () => setLang(b.dataset.lang));
[...document.querySelectorAll('#theme button')].forEach(b => b.onclick = () => setTheme(b.dataset.theme, true));

initTheme();
fillBrands();
setLang('ko');
</script>
